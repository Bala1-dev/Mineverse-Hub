name: External installation/validation report
description: Report a sanitized independent Unreal Engine 5.6 consumer validation result.
title: "External validation: Mineverse Open-Core v0.1.0 on UE 5.6 Win64"
labels: ["validation", "v0.1.x"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for validating Mineverse Open Core. Do not include secrets, private endpoints, credentials, private paths, customer data, or sensitive logs. Security-sensitive reports belong in private vulnerability reporting, not a public issue.
  - type: input
    id: unreal-engine-version
    attributes:
      label: Unreal Engine version and source
      description: Example: 5.6.1 from Epic Games Launcher, or source-built 5.6.
      placeholder: "UE 5.6.1, Epic Games Launcher"
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: compiler-toolchain
    attributes:
      label: Compiler/toolchain
      placeholder: "Visual Studio 2022, MSVC 14.xx, Windows SDK xx"
    validations:
      required: true
  - type: dropdown
    id: installation-method
    attributes:
      label: Installation method
      options:
        - Release ZIP copied to Plugins/MineverseOpenCore
        - GitHub source checkout copied to Plugins/MineverseOpenCore
        - Other sanitized method
    validations:
      required: true
  - type: checkboxes
    id: build-targets
    attributes:
      label: Build targets attempted
      options:
        - label: Win64 UnrealEditor Development
        - label: Win64 UnrealGame Development
        - label: Win64 UnrealGame Shipping
  - type: dropdown
    id: automation-test-result
    attributes:
      label: Automation-test result
      options:
        - Mineverse.OpenCore.Consumer.Contracts passed
        - Mineverse.OpenCore.Consumer.Contracts failed
        - Not attempted
    validations:
      required: true
  - type: dropdown
    id: private-dependency-confirmation
    attributes:
      label: Private dependency confirmation
      description: Confirm whether the public plugin required any private Mineverse material.
      options:
        - No private Mineverse module, configuration, asset, service, or content dependency was required
        - A possible private dependency was encountered
    validations:
      required: true
  - type: textarea
    id: error-summary
    attributes:
      label: Error summary with credentials and private paths removed
      description: Keep this concise. Redact private paths, credentials, endpoints, and sensitive logs.
      placeholder: "Build/test passed, or sanitized summary of the error."
    validations:
      required: true
